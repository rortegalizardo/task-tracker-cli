name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run lint
      - run: npm run test:unit
      - name: perf (ttc add / ttc list, 10,000 tasks)
        if: ${{ !cancelled() }}
        run: npm run test:perf
